# Publica en cada etiqueta vX.Y.Z:
#   - el paquete «contlity» en PyPI (publicador de confianza / OIDC: sin tokens ni contraseñas)
#   - el driver JDBC (jdbc/) como contlity-jdbc.jar en el release de GitHub
name: contlity

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Construir
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Revisar
        run: |
          python -m pip install "dist/$(ls dist | grep whl)[sqlalchemy]"
          cd /tmp
          python - <<'PY'
          import os, contlity, contlity.dbapi as d, sqlalchemy as sa
          ref = os.environ.get("GITHUB_REF_NAME", "")
          assert not ref.startswith("v") or ref[1:] == contlity.__version__, (ref, contlity.__version__)
          assert d.formatear("SELECT %s, %(x)s", None) == "SELECT %s, %(x)s"
          assert d.formatear("SELECT %s", ("a'b",)) == "SELECT 'a''b'"
          e = sa.create_engine("contlity://:ctly_live_x@/despacho")
          assert e.dialect.name == "contlity"
          print("contlity", contlity.__version__, "ok")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: python
          path: dist/

  jdbc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Construir
        run: |
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          cd jdbc && ./build.sh "$VER"
          java -jar "dist/contlity-jdbc-$VER.jar" | grep -q "Contlity JDBC $VER"
      - uses: actions/upload-artifact@v7
        with:
          name: jdbc
          path: jdbc/dist/

  pypi:
    needs: [python, jdbc]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: [pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artefactos/
      - name: Release de GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "contlity $GITHUB_REF_NAME" \
            --notes "SDK de Python: pip install contlity==${GITHUB_REF_NAME#v}. Driver JDBC: contlity-jdbc.jar (Java 11+, sin dependencias). Guía: https://contlity.tech-mx.cloud/docs/sdk" \
            artefactos/jdbc/*.jar artefactos/python/*
