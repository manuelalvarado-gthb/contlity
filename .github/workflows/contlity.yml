# Publica el paquete «contlity» en PyPI al empujar una etiqueta vX.Y.Z.
# PyPI confía en este flujo (publicador de confianza / OIDC): no hay tokens ni contraseñas.
name: contlity

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construir
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Revisar
        run: |
          python -m pip install "dist/$(ls dist | grep whl)[sqlalchemy]"
          cd /tmp
          python - <<'PY'
          import os, contlity, contlity.dbapi as d, sqlalchemy as sa
          ref = os.environ.get("GITHUB_REF_NAME", "")
          assert not ref.startswith("v") or ref[1:] == contlity.__version__, (ref, contlity.__version__)
          assert d.formatear("SELECT %s, %(x)s", None) == "SELECT %s, %(x)s"
          assert d.formatear("SELECT %s", ("a'b",)) == "SELECT 'a''b'"
          e = sa.create_engine("contlity://:ctly_live_x@/despacho")
          assert e.dialect.name == "contlity"
          print("contlity", contlity.__version__, "ok")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publicar:
    needs: construir
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
