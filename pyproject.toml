[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contlity"
version = "0.4.0"
description = "SDK oficial para la API de Contlity — automatización fiscal e integraciones ERP"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
authors = [
    { name = "Contlity" },
]
keywords = ["contlity", "sat", "cfdi", "fiscal", "mexico", "erp", "dbapi", "sqlalchemy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock", "responses"]
sqlalchemy = ["sqlalchemy>=2.0"]

[project.entry-points."sqlalchemy.dialects"]
contlity = "contlity.sqlalchemy_dialect:ContlityDialect"

[project.urls]
Homepage      = "https://contlity.tech-mx.cloud"
Documentation = "https://contlity.tech-mx.cloud/docs/sdk"
Repository    = "https://github.com/manuelalvarado-gthb/contlity"
Issues        = "https://github.com/manuelalvarado-gthb/contlity/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["contlity*"]
